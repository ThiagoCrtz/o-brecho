server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
  tomcat:
    max-http-form-post-size: 64KB
spring:
  application:
    name: brecho-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/brecho}
    username: ${DB_USER:brecho}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 10000
  jackson:
    deserialization:
      fail-on-unknown-properties: true
      fail-on-null-for-primitives: true
  mvc:
    problemdetails:
      enabled: true
app:
  cors-origin: ${FRONTEND_ORIGIN:http://localhost:5174}
  bootstrap:
    username: ${BOOTSTRAP_USERNAME:}
    password: ${BOOTSTRAP_PASSWORD:}
